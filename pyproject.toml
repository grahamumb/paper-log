[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-log"
version = "0.1.0"
description = "Generate printable journals with QR-coded pages for automatic scanning and cataloguing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0",
    "segno>=1.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# `paperlog verify` rasterises a finished PDF and decodes the codes back off it;
# `paperlog scan` reads photographs. Same backend, so one extra covers both.
verify = ["pypdfium2>=4.0", "opencv-python-headless>=4.8", "numpy>=1.24", "pillow>=10.0"]
# iPhones shoot HEIC by default and OpenCV cannot read it.
heic = ["pillow-heif>=0.13"]
dev = ["pytest>=7.0", "paper-log[verify]", "paper-log[heic]"]

[project.scripts]
paperlog = "paperlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
